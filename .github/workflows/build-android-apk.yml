name: Build PricePulse World Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "src/**"
      - "public/**"
      - "package.json"
      - "index.html"
      - ".github/workflows/build-android-apk.yml"

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Install web dependencies
        run: npm install

      - name: Build web app
        run: npm run build

      - name: Install Capacitor
        run: npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Configure Capacitor
        run: npx cap init "PricePulse World" com.pricepulse.world --web-dir dist

      - name: Add Android project
        run: npx cap add android

      - name: Copy web app into Android project
        run: npx cap sync android

      - name: Align Kotlin standard library versions
        run: |
          cat >> android/build.gradle <<'GRADLE'

          allprojects {
              configurations.configureEach {
                  resolutionStrategy.eachDependency { details ->
                      if (details.requested.group == "org.jetbrains.kotlin" &&
                          details.requested.name.startsWith("kotlin-stdlib")) {
                          details.useVersion("1.8.22")
                          details.because("Align Kotlin standard library modules to avoid duplicate classes")
                      }
                  }
              }
          }
          GRADLE

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pricepulse-world-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
